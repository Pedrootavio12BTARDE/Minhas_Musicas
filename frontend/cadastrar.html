<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Música</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="glass-panel">
            <div class="header">
                <h1>Cadastrar música</h1>
                <a href="index.html" class="link-btn">Voltar para a lista</a>
            </div>
            <form id="form-cadastro">
                <div class="form-group"><label>Título</label><input type="text" id="titulo" required></div>
                <div class="form-group"><label>Artista</label><input type="text" id="artista" required></div>
                <div class="form-group"><label>Gênero</label><input type="text" id="genero" required></div>
                <div class="form-group"><label>Ano</label><input type="number" id="ano" required></div>
                <div class="form-group"><label>Duração (minutos)</label><input type="number" id="duracao" required></div>
                <button type="submit" class="btn solid">Cadastrar</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/musicas';

        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dados = {
                titulo: document.getElementById('titulo').value,
                artista: document.getElementById('artista').value,
                genero: document.getElementById('genero').value,
                ano: document.getElementById('ano').value,
                duracao: document.getElementById('duracao').value
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
